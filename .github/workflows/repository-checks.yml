name: Repository checks

on:
  pull_request:
  push:
    branches: [main, codex/prototype-design-flows]

permissions:
  contents: read

jobs:
  delivery-guard-tests:
    name: delivery-guard-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test the CI inspection helper, not the application
        run: node --test scripts/check-pr.test.mjs
  prototype-build:
    name: prototype-build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: prototypes/openingos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: npm ci
      - run: npm run build
      - run: npm run test:sites
